version: '3.8'

# Production Docker Compose Configuration
# Optimized for performance, security, and reliability in production environments

services:
  # Database service with production-grade settings
  postgres:
    image: postgres:16-alpine
    container_name: video_summarizer_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-video_summarizer}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      # PostgreSQL tuning for production
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_SHARED_PRELOAD_LIBRARIES: pg_stat_statements
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:rw
      - ./init-scripts:/docker-entrypoint-initdb.d:ro  # Initialization scripts
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-video_summarizer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Security and performance tunings
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=100
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
    security_opt:
      - no-new-privileges:true

  # Redis service with production settings
  redis:
    image: redis:7.2-alpine
    container_name: video_summarizer_redis_prod
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-defaultpassword}
      --bind 127.0.0.1
      --protected-mode yes
      --tcp-keepalive 60
      --save 900 1 300 10 60 10000
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro  # Custom config
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # File storage service
  minio:
    image: minio/minio:RELEASE.2024-07-26T18-20-51Z
    container_name: video_summarizer_minio_prod
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${SECRET_KEY_S3:-minio123}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: unless-stopped
    # Security: Run as non-root user
    user: "1000:1000"

  # Tracing and monitoring service
  jaeger:
    image: jaegertracing/all-in-one:1.58
    container_name: video_summarizer_jaeger_prod
    ports:
      - "6831:6831/udp" # Jaeger agent
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=100000
    networks:
      - app-network
    restart: unless-stopped

  # Production backend API with Gunicorn
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: video_summarizer_backend_prod
    command: >
      gunicorn
      -w 4
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --timeout 120
      --workers-per-core 2
      --max-requests 1000
      --max-requests-jitter 100
      --preload-app
      --access-logfile -
      --error-logfile -
      --log-level info
      --keep-alive 5
      --max-keep-alive-requests 100
      main:app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpassword}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-defaultpassword}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-defaultpassword}@redis:6379/1
      - LOG_LEVEL=INFO
      - WORKERS_PER_CORE=2
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./main.py:/app/main.py:ro
      - ./alembic:/app/alembic:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - media_data:/app/media
      - ./logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Security configurations
    security_opt:
      - no-new-privileges:true
    # Run with limited capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  # Background processing worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: video_summarizer_worker_prod
    command: >
      celery
      -A src.celery_app:celery worker
      --loglevel=info
      --concurrency=4
      --pool=gevent
      --max-tasks-per-child=100
      --heartbeat-interval=30
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-defaultpassword}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-s3}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-defaultpassword}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-defaultpassword}@redis:6379/1
      - LOG_LEVEL=INFO
      - C_FORCE_ROOT=1  # Enable for production, only if necessary
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/media
      - ./logs:/app/logs
    networks:
      - app-network
    restart: unless-stopped
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.75'
          memory: 512M
    healthcheck:
      test: ["CMD", "celery", "-A", "src.celery_app:celery", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Security configurations
    security_opt:
      - no-new-privileges:true

  # Production-ready frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: video_summarizer_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:8000
    networks:
      - app-network
    restart: unless-stopped
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # Security configurations
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    driver: local
    name: video_summarizer_postgres_data_prod
  redis_data:
    driver: local
    name: video_summarizer_redis_data_prod
  minio_data:
    driver: local
    name: video_summarizer_minio_data_prod
  media_data:
    driver: local
    name: video_summarizer_media_data_prod

networks:
  app-network:
    driver: bridge
    name: video_summarizer_network_prod
    # Add network security
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: "1500"