version: '3.8'

# Production Docker Compose
# Use with: docker-compose -f docker-compose.prod.yml up -d

services:
  # --- INFRASTRUCTURE SERVICES ---
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - app-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${SECRET_KEY_S3}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "6831:6831/udp"
    networks:
      - app-network
    restart: unless-stopped

  # --- APPLICATION SERVICES ---
  backend: # Renamed from 'api' for clarity
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: gunicorn -k uvicorn.workers.UvicornWorker -w 4 -b 0.0.0.0:8000 main:app
    # No ports exposed to the host. Communication is through the frontend proxy.
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - app-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: celery -A src.shared.events.event_bus.celery worker --loglevel=info -c 4
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  frontend: # New frontend service, the single entry point to the application
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80" # Expose port 80 to the host machine
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge
