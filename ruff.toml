# ruff.toml

line-length = 88

[lint]
select = ["E", "F", "W", "I", "N"]
# Excluir pastas/vendor e scripts utilitários
exclude = [
    "alembic/versions/*",
    "docs",
    "scripts",
]
# Permitir imports não usados em __init__.py
per-file-ignores = {"__init__.py" = ["F401"], "tests/**" = ["E501"], "scripts/**" = ["E501"]}
ignore = [
    "E402", # module import not at top (permitimos em __init__)
    "E722", # bare except
]

[format]
# Use black-compatible formatting.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
