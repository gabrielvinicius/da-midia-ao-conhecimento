[mypy]
# --- Global Options ---
python_version = 3.11
warn_return_any = true
warn_unused_configs = true

# --- Import Discovery ---
# This allows mypy to find modules in the `src` directory
mypy_path = src

# --- Strictness Options ---
# Enable strict checks for function definitions
disallow_untyped_defs = true
disallow_incomplete_defs = true

# --- Import Handling ---
# This is a common setting to avoid errors from third-party libraries
# that don't have type stubs.
ignore_missing_imports = true

# --- Per-module options for specific libraries ---

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-av.*]
ignore_missing_imports = True

[mypy-resampy.*]
ignore_missing_imports = True

[mypy-fitz.*]
ignore_missing_imports = True
