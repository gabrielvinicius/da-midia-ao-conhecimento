# Métricas expostas na porta interna 9100 (METRICS_PORT), fora da API pública.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["backend:9100"]
  - job_name: worker-heavy
    static_configs:
      - targets: ["worker-heavy:9100"]
  - job_name: worker-light
    static_configs:
      - targets: ["worker-light:9100"]
