# Garage (perfil "s3" do docker-compose.yml): um nó só, sem réplica. Os
# segredos vêm do .env pelo ambiente: GARAGE_RPC_SECRET (obrigatório, mesmo
# com um nó) e a chave e o bucket padrão (STORAGE_S3_*).
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# SQLite em vez do LMDB (o padrão): mais lento, mas sem o risco de corromper
# o banco num desligamento abrupto, que o LMDB tem; para um nó só, o
# desempenho do LMDB não faz diferença.
db_engine = "sqlite"
# Cópia do banco de metadados a cada 6 horas, em meta/snapshots (o backup.sh
# também tira uma antes de cada cópia de segurança).
metadata_auto_snapshot_interval = "6h"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# A mesma região do adaptador S3 (STORAGE_S3_REGION, us-east-1 por padrão).
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"
