services:
  backend:
    image: video-summarizer-app:cuda
    build:
      args:
        - PYTORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
    environment:
      - AI_DEVICE=cuda

  worker-heavy:
    image: video-summarizer-app:cuda
    build:
      args:
        - PYTORCH_INDEX_URL=https://download.pytorch.org/whl/cu124
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - AI_DEVICE=cuda
      - AI_COMPUTE_TYPE=float16