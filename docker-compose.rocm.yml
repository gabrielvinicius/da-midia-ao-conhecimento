# Uso: docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d
# GPU AMD (ROCm): troca as reservas NVIDIA pelos dispositivos /dev/kfd e
# /dev/dri (!reset exige Docker Compose 2.24 ou mais recente).
services:
  ollama:
    image: ollama/ollama:rocm
    deploy: !reset {}
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render

  backend:
    image: video-summarizer-app:rocm
    build:
      args:
        - PYTORCH_EXTRA_INDEX_URL=https://download.pytorch.org/whl/rocm6.2.4
    environment:
      - AI_DEVICE=cuda # PyTorch ROCm usa backend 'cuda'

  worker-heavy:
    image: video-summarizer-app:rocm
    deploy: !reset {}
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    build:
      args:
        - PYTORCH_EXTRA_INDEX_URL=https://download.pytorch.org/whl/rocm6.2.4
    environment:
      - AI_DEVICE=cuda
      - AI_COMPUTE_TYPE=float16