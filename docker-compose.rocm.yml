# Uso: docker compose -f docker-compose.yml -f docker-compose.rocm.yml up -d --build
# GPU AMD (ROCm): troca as reservas NVIDIA pelos dispositivos /dev/kfd e
# /dev/dri (!reset exige Docker Compose 2.24 ou mais recente). O PyTorch ROCm
# usa o nome "cuda"; a transcrição (CTranslate2) não roda em GPU AMD e passa
# sozinha para a CPU. O torch 2.14 para AMD é o do ROCm 7.2: o driver do host
# precisa ser compatível (não testado; a máquina de referência é NVIDIA).
services:
  ollama:
    image: ollama/ollama:0.35.1-rocm
    deploy: !reset {}
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render

  backend:
    image: app-rocm:${APP_TAG:-current}
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/rocm7.2

  worker-heavy:
    image: app-rocm:${APP_TAG:-current}
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/rocm7.2
    deploy: !override
      resources:
        limits:
          memory: 12G
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render

  worker-light:
    image: app-rocm:${APP_TAG:-current}
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/rocm7.2

  # As migrações rodam na mesma imagem da variante.
  migrate:
    image: app-rocm:${APP_TAG:-current}
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/rocm7.2
