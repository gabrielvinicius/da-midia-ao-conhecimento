# Uso: docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build
# Sem GPU: imagem com o PyTorch de CPU e sem as reservas de placa NVIDIA
# (!reset e !override exigem Docker Compose 2.24 ou mais recente). Funciona,
# mas a transcrição e o resumo ficam muitas vezes mais lentos.
services:
  ollama:
    deploy: !reset {}

  backend:
    image: sintese-app:cpu
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    environment:
      AI_DEVICE: cpu

  worker-heavy:
    image: sintese-app:cpu
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    command: celery -A src.celery_app:celery worker --loglevel=info --concurrency=2 -Q transcription_fast_lane,transcription_queue,text_analysis_queue
    deploy: !override
      resources:
        limits:
          memory: 12G
    environment:
      AI_DEVICE: cpu
      AI_COMPUTE_TYPE: int8

  worker-light:
    image: sintese-app:cpu
    build:
      args:
        PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
