[tool.poetry]
name = "video-summarizer"
version = "2.0.0"
description = "Sistema avançado de processamento de mídia com DDD e arquitetura modular"
authors = ["Your Team <team@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# --- Core & Web Framework ---
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
gunicorn = "^22.0.0"
uvloop = {version = "^0.19.0", markers = "sys_platform != 'win32'"}
pydantic = "^2.8.2"
pydantic-settings = "^2.3.4"
python-dotenv = "^1.0.1"

# --- Database & ORM ---
sqlalchemy = "^2.0.31"
alembic = "^1.13.2"
psycopg2-binary = "^2.9.9"   # For Alembic and sync operations
asyncpg = "^0.29.0"          # For FastAPI async operations

# --- Asynchronous Tasks & Messaging ---
celery = "^5.4.0"
redis = "^5.0.7"

# --- Caching & Performance ---
redis-py = "^5.0.7"
aiocache = "^0.12.2"
aiofiles = "^24.1.0"

# --- AI / Machine Learning ---
torch = ">=2.4.0"
transformers = "^4.42.4"
openai-whisper = "20231117"
faster-whisper = "^1.0.3"
numpy = "^2.0.0"
scikit-learn = "^1.5.1"      # For Topic Modeling

# --- Authentication & Security ---
passlib = {extras = ["bcrypt"], version = "1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}

# --- AWS & S3 Storage ---
boto3 = "^1.34.141"

# --- Media Processing ---
av = "^12.1.0"
resampy = "^0.4.3"
pymupdf = "^1.24.9"          # For PDF text extraction

# --- Observability & Resilience ---
structlog = "^24.2.0"
prometheus-client = "^0.20.0"
pybreaker = "^1.1.0"

# --- OpenTelemetry for Distributed Tracing ---
opentelemetry-api = "^1.25.0"
opentelemetry-sdk = "^1.25.0"
opentelemetry-exporter-jaeger = "^1.25.0"
opentelemetry-instrumentation-fastapi = "^0.46.0"
opentelemetry-instrumentation-celery = "^0.46.0"
opentelemetry-instrumentation-sqlalchemy = "^0.46.0"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*joblib will operate in serial mode.*:UserWarning",
    "ignore:.*'crypt' is deprecated and slated for removal.*:DeprecationWarning:passlib.utils.*",
]
markers = [
    "smoke: fast smoke coverage (no external deps)",
    "integration: tests that require real services/db",
]
testpaths = [
    "tests/unit",
    "tests/smoke",
    "tests/integration",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.8"
httpx = "^0.27.0"            # Testes de API
factory-boy = "^3.3.0"       # Fixtures
ruff = "^0.5.0"              # Linting e formatação
mypy = "^1.11.0"             # Type checking
