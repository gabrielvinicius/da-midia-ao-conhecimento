# Dependências: requirements.txt (execução) e requirements-dev.txt (testes).
# Antes, uma lista do Poetry repetia as dependências com versões diferentes.
[project]
name = "video-summarizer"
version = "2.0.0"
description = "Plataforma de transcrição, resumo e busca semântica de aulas gravadas"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*joblib will operate in serial mode.*:UserWarning",
]
markers = [
    "smoke: fast smoke coverage (no external deps)",
    "integration: tests that require real services/db",
]
testpaths = [
    "tests/unit",
    "tests/smoke",
    "tests/integration",
]
