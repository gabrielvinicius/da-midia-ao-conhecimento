services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: video_summarizer_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-video_summarizer}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-video_summarizer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: video_summarizer_redis
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: video_summarizer_minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: video_summarizer_jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      # Só na própria máquina: os rastros incluem dados das requisições.
      - "127.0.0.1:16686:16686"  # interface web do Jaeger
    networks:
      - backend-net
      - public-net

  prometheus:
    # Coleta as métricas da API e dos workers pela porta interna 9100.
    image: prom/prometheus:latest
    container_name: video_summarizer_prometheus
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"  # interface web, só na própria máquina
    networks:
      - backend-net
      - public-net

  ollama:
    # LLM local (Qwen3.5-9B por padrão). Os modelos são baixados pelo
    # serviço ollama-models na primeira inicialização.
    image: ollama/ollama:latest
    container_name: video_summarizer_ollama
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Descarrega o modelo da GPU após 5 min ocioso, liberando VRAM.
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=1
      # Atenção eficiente e cache de contexto em 8 bits: cerca de metade da
      # memória de GPU do contexto, com perda de qualidade desprezível.
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    networks:
      - backend-net
      # backend-net é interna (sem internet); public-net dá a saída necessária
      # para o "ollama pull". Nenhuma porta é publicada no host.
      - public-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  ollama-models:
    # Roda uma vez a cada "up": baixa o modelo principal e o reserva, se ainda
    # não estiverem no volume ollama_models (downloads seguintes são rápidos).
    image: ollama/ollama:latest
    container_name: video_summarizer_ollama_models
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:9b}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-gemma4:e4b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$$LLM_MODEL\" && ollama pull \"$$LLM_FALLBACK_MODEL\""]
    networks:
      - backend-net
    restart: "no"

  backend:
    build:
      context: .
      target: runtime
    image: video-summarizer-app:latest
    container_name: video_summarizer_backend
    ports:
      # Só na própria máquina (documentação da API e depuração). O acesso
      # externo passa pelo Nginx do frontend, que define o X-Real-IP usado
      # no limite de tentativas de login; acessar a API direto permitiria
      # forjar esse cabeçalho.
      - "127.0.0.1:8000:8000"
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/storage
      - ai_models_cache:/app/.cache
    networks:
      - backend-net
      - public-net
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=${DB_SCHEME:-postgresql+asyncpg}://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-video-summarizer}
      - STORAGE_S3_ENDPOINT_URL=${STORAGE_S3_ENDPOINT_URL:-http://minio:9000}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-minio}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-minio123}
      - HF_TOKEN=${HF_TOKEN}
      - AI_DEVICE=cuda
      - OLLAMA_HOST=http://ollama:11434
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:9b}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-gemma4:e4b}
      - VISUAL_PROVIDER=${VISUAL_PROVIDER:-moondream}
      - ANALYSIS_FACTORS=${ANALYSIS_FACTORS:-sentiment,topics,grounding}
      # Métricas só na rede interna (coletadas pelo serviço prometheus).
      - METRICS_PORT=9100

  worker-heavy:
    build:
      context: .
      target: runtime
    image: video-summarizer-app:latest
    container_name: video_summarizer_worker_heavy
    entrypoint: /app/docker/worker-entrypoint.sh
    # Processa filas pesadas: Vídeo, Transcrição e Análise de Texto
    command: celery -A src.celery_app:celery worker --loglevel=info --concurrency=1 -Q transcription_fast_lane,transcription_queue,text_analysis_queue
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
      ollama: { condition: service_started }
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/storage
      - ai_models_cache:/app/.cache
    networks:
      - backend-net
      - public-net
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=${DB_SCHEME:-postgresql+asyncpg}://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-video-summarizer}
      - STORAGE_S3_ENDPOINT_URL=${STORAGE_S3_ENDPOINT_URL:-http://minio:9000}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-minio}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-minio123}
      - HF_TOKEN=${HF_TOKEN}
      - AI_DEVICE=cuda
      - OLLAMA_HOST=http://ollama:11434
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - LLM_MODEL=${LLM_MODEL:-qwen3.5:9b}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-gemma4:e4b}
      - VISUAL_PROVIDER=${VISUAL_PROVIDER:-moondream}
      - ANALYSIS_FACTORS=${ANALYSIS_FACTORS:-sentiment,topics,grounding}
      - METRICS_PORT=9100
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus

  worker-light:
    build:
      context: .
      target: runtime
    image: video-summarizer-app:latest
    container_name: video_summarizer_worker_light
    entrypoint: /app/docker/worker-entrypoint.sh
    # Processa fila default (notificações, IO)
    # --beat agenda a verificação de mídias paradas (uma única instância).
    command: celery -A src.celery_app:celery worker --loglevel=info --concurrency=4 -Q celery --beat --schedule /tmp/celerybeat-schedule
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/storage
    networks:
      - backend-net
      - public-net
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=${DB_SCHEME:-postgresql+asyncpg}://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - STORAGE_S3_BUCKET=${STORAGE_S3_BUCKET:-video-summarizer}
      - STORAGE_S3_ENDPOINT_URL=${STORAGE_S3_ENDPOINT_URL:-http://minio:9000}
      - STORAGE_S3_ACCESS_KEY=${STORAGE_S3_ACCESS_KEY:-minio}
      - STORAGE_S3_SECRET_KEY=${STORAGE_S3_SECRET_KEY:-minio123}
      - HF_TOKEN=${HF_TOKEN}
      - AI_DEVICE=cpu
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - METRICS_PORT=9100
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus


  frontend:
    # Mesmo Dockerfile usado no deploy (submódulo frontend). Rode antes:
    #   git submodule update --init frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: video_summarizer_frontend
    ports: ["3000:80"]
    depends_on: [backend]
    networks:
      - public-net

volumes:
  postgres_data:
  minio_data:
  media_data:
  ai_models_cache:
  ollama_models:

networks:
  public-net:
    name: video_summarizer_public
  backend-net:
    name: video_summarizer_backend
    internal: true