services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: video_summarizer_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-video_summarizer}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-video_summarizer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: video_summarizer_redis
    networks:
      - backend-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: video_summarizer_minio
    environment:
      MINIO_ROOT_USER: ${ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${SECRET_KEY_S3:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - backend-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: video_summarizer_jaeger
    networks:
      - backend-net
      - public-net

  backend:
    build:
      context: .
      target: runtime
    image: video-summarizer-app:latest
    container_name: video_summarizer_backend
    ports:
      - "8000:8000"
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/storage
      - ai_models_cache:/app/.cache
    networks:
      - backend-net
      - public-net
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DB_SCHEME:-postgresql+asyncpg}://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - HF_TOKEN=${HF_TOKEN}
      - AI_DEVICE=${AI_DEVICE:-cpu}

  worker-heavy:
    build:
      context: .
      target: runtime
    image: video-summarizer-app:latest
    container_name: video_summarizer_worker_heavy
    entrypoint: /app/docker/worker-entrypoint.sh
    # Processa filas pesadas: Vídeo, Transcrição e Análise de Texto
    command: celery -A src.celery_app:celery worker --loglevel=info --concurrency=2 -Q video_fast_lane,video_queue,transcription_fast_lane,transcription_queue,text_analysis_fast_lane,text_analysis_queue
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/storage
      - ai_models_cache:/app/.cache
    networks:
      - backend-net
      - public-net
    deploy:
      resources:
        limits:
          memory: 12G
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DB_SCHEME:-postgresql+asyncpg}://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - HF_TOKEN=${HF_TOKEN}
      - AI_DEVICE=${AI_DEVICE:-cpu}

  worker-light:
    build:
      context: .
      target: runtime
    image: video-summarizer-app:latest
    container_name: video_summarizer_worker_light
    entrypoint: /app/docker/worker-entrypoint.sh
    # Processa fila default (notificações, IO)
    command: celery -A src.celery_app:celery worker --loglevel=info --concurrency=4 -Q celery
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/storage
    networks:
      - backend-net
      - public-net
    deploy:
      resources:
        limits:
          memory: 2G
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DB_SCHEME:-postgresql+asyncpg}://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - HF_TOKEN=${HF_TOKEN}
      - AI_DEVICE=cpu


  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: video_summarizer_frontend
    ports: ["3000:80"]
    depends_on: [backend]
    networks:
      - public-net

volumes:
  postgres_data:
  minio_data:
  media_data:
  ai_models_cache:

networks:
  public-net:
    name: video_summarizer_public
  backend-net:
    name: video_summarizer_backend
    internal: true