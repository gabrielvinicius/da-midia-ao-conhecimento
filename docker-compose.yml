services:
  postgres:
    image: postgres:latest
    container_name: video_summarizer_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-video_summarizer}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-video_summarizer}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: video_summarizer_redis
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: video_summarizer_minio
    environment:
      MINIO_ROOT_USER: ${ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${SECRET_KEY_S3:-minio123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: video_summarizer_jaeger
    networks:
      - app-network

  backend:
    build:
      context: .
      target: runtime
    image: video-summarizer-app:latest
    container_name: video_summarizer_backend
    env_file: [.env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./src:/app/src:ro
      - media_data:/app/media
      - ai_models_cache:/app/.cache
    networks:
      - app-network
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DB_SCHEME:-postgresql+asyncpg}://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - HF_TOKEN=${HF_TOKEN}

  worker:
    build:
      context: .
      target: runtime
    image: video-summarizer-app:latest
    container_name: video_summarizer_worker
    entrypoint: /app/docker/worker-entrypoint.sh
    networks:
      - app-network
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=${DB_SCHEME:-postgresql+asyncpg}://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - HF_TOKEN=${HF_TOKEN}


  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: video_summarizer_frontend
    ports: ["3000:80"]
    depends_on: [backend]
    networks:
      - app-network

volumes:
  postgres_data:
  minio_data:
  media_data:
  ai_models_cache:

networks:
  app-network:
    name: video_summarizer_network