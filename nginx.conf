# Interface (arquivos estáticos) e proxy para a API em /api.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeçalhos de segurança. O Nginx não herda add_header para dentro de um
    # location que tenha os seus; por isso eles se repetem abaixo.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Arquivos gerados pelo build têm o conteúdo no nome: podem ficar em cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri =404;
    }

    # Rotas da aplicação de página única. O index.html nunca fica em cache:
    # depois de uma atualização, um index antigo apontaria para arquivos que
    # não existem mais, e as páginas carregadas sob demanda falhariam.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        try_files $uri $uri/ /index.html;
    }

    # Envio de mídias: só aqui o corpo pode ter até 500 MB (mesmo limite da API).
    location /api/media/ {
        client_max_body_size 500m;
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket dos avisos: conexão longa.
    location /api/ws/notifications {
        proxy_pass http://backend:8000/ws/notifications;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Arquivos ocultos (.env, .git) nunca são servidos.
    location ~ /\. {
        deny all;
    }
}
