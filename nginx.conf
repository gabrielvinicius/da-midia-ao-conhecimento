server {
    listen 80;
    server_name localhost;

    # Root directory for the React app
    root /usr/share/nginx/html;
    index index.html;

    # Handle client-side routing for the Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for the backend API services
    # All API calls will be forwarded to the backend container
    location ~ ^/(auth|media|transcriptions|summaries|notifications|providers|metrics|topic-modeling|sentiment|text-analysis|events) {
        proxy_pass http://backend:8000; # Backend service is named 'backend' in docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Special configuration for the WebSocket connection
    location /ws/notifications {
        proxy_pass http://backend:8000/ws/notifications;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400; # Keep connection open
    }

    # Optional: Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
