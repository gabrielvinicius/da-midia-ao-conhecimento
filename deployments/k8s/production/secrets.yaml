# deployments/k8s/production/secrets.yaml
# ATENÇÃO: Este arquivo contém placeholders. 
# Em produção, use ferramentas como Sealed Secrets, External Secrets Operator ou Vault.

apiVersion: v1
kind: Secret
metadata:
  name: video-summarizer-secrets
  namespace: video-summarizer-prod
  labels:
    app: video-summarizer
    environment: production
type: Opaque
stringData:
  # Database credentials
  DB_USER: "postgres"
  DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  
  # JWT secrets
  SECRET_KEY: "REPLACE_WITH_STRONG_SECRET_KEY_64_CHARS_MIN"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  
  # S3/MinIO credentials
  BUCKET_NAME: "video-summarizer-prod"
  ENDPOINT_URL: "https://s3.amazonaws.com"
  ACCESS_KEY: "REPLACE_WITH_AWS_ACCESS_KEY"
  SECRET_KEY_S3: "REPLACE_WITH_AWS_SECRET_KEY"
  
  # OpenAI API (if used)
  OPENAI_API_KEY: "REPLACE_WITH_OPENAI_KEY"
  
  # SMTP configuration
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "REPLACE_WITH_SMTP_USER"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"
  
  # Slack webhook for notifications
  SLACK_WEBHOOK: "REPLACE_WITH_SLACK_WEBHOOK_URL"

---
# TLS Certificate Secret (use cert-manager in production)
apiVersion: v1
kind: Secret
metadata:
  name: video-summarizer-tls
  namespace: video-summarizer-prod
  labels:
    app: video-summarizer
    environment: production
type: kubernetes.io/tls
data:
  # Replace with actual base64-encoded certificate and key
  tls.crt: LS0tLS1CRUdJTi...
  tls.key: LS0tLS1CRUdJTi...