# deployments/k8s/production/worker-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: video-summarizer-prod
  labels:
    app: worker
    component: celery
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: worker
      component: celery
  template:
    metadata:
      labels:
        app: worker
        component: celery
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9540"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: worker
        image: ghcr.io/yourorg/video-summarizer-worker:latest
        imagePullPolicy: IfNotPresent
        
        # Environment variables
        envFrom:
        - configMapRef:
            name: video-summarizer-config
        - secretRef:
            name: video-summarizer-secrets
        
        env:
        - name: CELERY_WORKER_CONCURRENCY
          value: "4"
        - name: CELERY_WORKER_PREFETCH_MULTIPLIER
          value: "1"
        - name: CELERY_WORKER_MAX_TASKS_PER_CHILD
          value: "1000"
        
        # Resource limits
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        # Health checks (Celery specific)
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "celery -A src.celery_app:celery inspect ping"
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 3
        
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "celery -A src.celery_app:celery inspect active"
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        
        # Volume mounts
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        - name: logs-volume
          mountPath: /app/logs
        - name: media-processing
          mountPath: /tmp/media_processing
      
      # Celery Exporter sidecar for metrics
      - name: celery-exporter
        image: danihodovic/celery-exporter:latest
        ports:
        - containerPort: 9540
          name: metrics
        env:
        - name: CELERY_EXPORTER_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_EXPORTER_LISTEN_ADDRESS
          value: "0.0.0.0:9540"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      
      # Volumes
      volumes:
      - name: tmp-volume
        emptyDir: {}
      - name: logs-volume
        emptyDir: {}
      - name: media-processing
        emptyDir:
          sizeLimit: 10Gi
      
      # Node affinity
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - worker
              topologyKey: kubernetes.io/hostname

---
# HPA for workers (CPU and Queue depth based)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: video-summarizer-prod
  labels:
    app: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 85
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # Wait longer before scaling down
      policies:
      - type: Percent
        value: 25
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# Service for metrics
apiVersion: v1
kind: Service
metadata:
  name: worker-metrics-service
  namespace: video-summarizer-prod
  labels:
    app: worker
    component: metrics
spec:
  type: ClusterIP
  ports:
  - port: 9540
    targetPort: 9540
    protocol: TCP
    name: metrics
  selector:
    app: worker
    component: celery

---
# Service Monitor for Celery metrics
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: worker-metrics
  namespace: video-summarizer-prod
  labels:
    app: worker
    release: prometheus
spec:
  selector:
    matchLabels:
      app: worker
      component: metrics
  endpoints:
  - port: metrics
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
