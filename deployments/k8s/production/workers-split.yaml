# Worker Heavy (GPU/AI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-heavy-deployment
  namespace: video-summarizer-prod
  labels:
    app: worker-heavy
    component: celery
spec:
  replicas: 1 # Controlled by KEDA
  selector:
    matchLabels:
      app: worker-heavy
  template:
    metadata:
      labels:
        app: worker-heavy
    spec:
      containers:
      - name: worker
        image: video-summarizer-app:latest
        command: ["celery", "-A", "src.celery_app:celery", "worker", "--loglevel=info", "--concurrency=2", "-Q", "video_fast_lane,video_queue,transcription_fast_lane,transcription_queue,text_analysis_fast_lane,text_analysis_queue"]
        envFrom:
        - configMapRef:
            name: video-summarizer-config
        - secretRef:
            name: video-summarizer-secrets
        resources:
          requests:
            memory: "4Gi"
            cpu: "1000m"
          limits:
            memory: "12Gi"
            cpu: "2000m"
            # nvidia.com/gpu: 1 # Uncomment for GPU nodes

---
# Worker Light (IO/Notifications)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-light-deployment
  namespace: video-summarizer-prod
  labels:
    app: worker-light
    component: celery
spec:
  replicas: 1 # Controlled by KEDA
  selector:
    matchLabels:
      app: worker-light
  template:
    metadata:
      labels:
        app: worker-light
    spec:
      containers:
      - name: worker
        image: video-summarizer-app:latest
        command: ["celery", "-A", "src.celery_app:celery", "worker", "--loglevel=info", "--concurrency=4", "-Q", "default"]
        envFrom:
        - configMapRef:
            name: video-summarizer-config
        - secretRef:
            name: video-summarizer-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
