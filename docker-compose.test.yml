version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    hostname: postgres-test
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: test_db
    networks:
      - app-network

  redis-test:
    image: redis:7-alpine
    hostname: redis-test
    networks:
      - app-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env.test
    depends_on:
      - postgres-test
      - redis-test
    networks:
      - app-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A src.celery_app:celery worker --loglevel=info
    env_file:
      - .env.test
    depends_on:
      - redis-test
      - postgres-test
    networks:
      - app-network

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pytest", "-v", "tests/e2e"]
    env_file:
      - .env.test
    depends_on:
      - api
      - worker
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
