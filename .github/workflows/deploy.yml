name: Build and Push Production Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Important: ensures the frontend submodule is checked out

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/video-summarizer-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/video-summarizer-frontend:latest

      - name: Deploy to production (Example)
        run: |
          echo "This is a placeholder for your deployment step."
          echo "In a real-world scenario, you would typically use a deploy action or SSH into your server to run the following commands:"
          echo "  docker-compose -f docker-compose.prod.yml pull"
          echo "  docker-compose -f docker-compose.prod.yml up -d"
          echo "This pulls the newly pushed images and restarts the services."
