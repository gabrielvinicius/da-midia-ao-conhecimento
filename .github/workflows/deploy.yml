name: Deploy

# Implantação contínua: quando a CI passa num push na main, o runner da
# máquina de produção (rótulo "producao") põe a pasta de produção na versão
# exata que passou e roda scripts/ops/deploy.ps1, que reconstrói, sobe,
# confere a saúde e, se falhar, volta à versão anterior. "Run workflow" na
# aba Actions reimplanta a main à mão.
on:
  # workflow_run aceito (zizmor): só reage à CI de pushes na main
  # (condição do job), roda o commit que a CI aprovou e não lê nada vindo de
  # pull requests (artefatos, títulos, ramos).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# O job não usa a API do GitHub: o token só lê o repositório.
permissions:
  contents: read

# Uma implantação por vez; a seguinte espera a atual terminar.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    # A execução manual também só vale para a main: um "Run workflow" num ramo
    # qualquer implantaria código que não passou pela CI da main. O ambiente
    # "producao" repete a regra (só a main), em vigor desde que o repositório
    # ficou público.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, producao]
    timeout-minutes: 60
    environment:
      name: producao
      url: ${{ vars.PUBLIC_URL }}
    # Variáveis do repositório (Settings > Secrets and variables > Actions):
    # DEPLOY_DIR, a pasta de produção na máquina do runner, e PUBLIC_URL.
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Código na versão que passou na CI
        id: code
        shell: pwsh
        run: |
          if (-not $env:DEPLOY_DIR) { Write-Host "::error::Defina a variável DEPLOY_DIR do repositório (pasta de produção)."; exit 1 }
          Set-Location $env:DEPLOY_DIR
          $previous = (git rev-parse HEAD).Trim()
          "previous=$previous" >> $env:GITHUB_OUTPUT
          git fetch --prune origin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git checkout --force --detach $env:TARGET_SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Produção: $previous -> $env:TARGET_SHA"

      - name: Reconstruir, subir e conferir a saúde
        shell: pwsh
        working-directory: ${{ env.DEPLOY_DIR }}
        env:
          PREVIOUS_SHA: ${{ steps.code.outputs.previous }}
        run: ./scripts/ops/deploy.ps1 -PreviousSha $env:PREVIOUS_SHA
