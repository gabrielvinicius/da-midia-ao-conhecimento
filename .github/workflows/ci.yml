name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      # O requirements.txt fixa o torch com CUDA (~2,5 GB). No CI não há GPU,
      # então instalamos o torch de CPU e o restante das dependências sem ele.
      - name: Python dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch==|--extra-index-url)' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt ruff

      # Erros que quebram em execução: sintaxe e nomes indefinidos.
      - name: Lint (critical errors)
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Tests (unit, smoke, integration)
        run: pytest tests/unit tests/smoke tests/integration -q
