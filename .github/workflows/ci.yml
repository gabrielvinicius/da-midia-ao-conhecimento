name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_summarizer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      # Sem GPU no CI: o torch (versão do requirements.txt) vem do índice de
      # CPU, e o restante das dependências é instalado sem ele.
      - name: Python dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep -E '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^torch==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt ruff

      # Erros que quebram em execução: sintaxe e nomes indefinidos.
      - name: Lint (critical errors)
        run: ruff check src tests --select E9,F63,F7,F82

      - name: Tests (unit, smoke, integration)
        run: pytest tests/unit tests/smoke tests/integration -q

      # API real contra PostgreSQL e Redis: cadastro, login, envio, isolamento
      # entre usuários, exclusão e bloqueio de login. Os modelos de IA não
      # rodam; as tarefas ficam na fila.
      - name: End-to-end API tests
        env:
          E2E: "1"
          LIGHTWEIGHT_BOOTSTRAP: "0"
          SECRET_KEY: chave-somente-para-a-integracao-continua-0123456789
          DEFAULT_ADMIN_EMAIL: admin@ci.test
          DEFAULT_ADMIN_PASSWORD: AdminCi2026
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/video_summarizer
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
        run: |
          alembic upgrade head
          pytest tests/e2e -q

  # Garante que um banco novo é criado só pelas migrações (é o que o
  # entrypoint do contêiner executa) e que o esquema bate com os modelos.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: video_summarizer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/video_summarizer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic "sqlalchemy[asyncio]" psycopg2-binary asyncpg aiosqlite pgvector \
            pydantic pydantic-settings python-dotenv structlog

      - name: Upgrade from an empty database
        run: alembic upgrade head

      - name: Models and schema match
        run: alembic check

      - name: Downgrade and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head
