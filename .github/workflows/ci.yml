name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Testes de componentes (Vitest). Os de ponta a ponta (Playwright,
      # tests/e2e) precisam do sistema inteiro rodando e ficam fora daqui.
      - name: Unit and component tests
        run: npm run test:ci

      - name: Build
        run: npm run build
