name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Execução manual (aba Actions), por exemplo depois de reativar o workflow.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      # Sem GPU no CI: torch e torchvision (versões do requirements.txt) vêm do
      # índice de CPU, e o restante das dependências é instalado sem eles.
      - name: Python dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          grep -E '^(torch|torchvision)==' requirements.txt > constraints-ci.txt
          pip install -r constraints-ci.txt --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)==' requirements.txt > requirements-ci.txt
          # As versões fixadas viram restrição: sem ela, o pip trocava o PyTorch
          # de CPU por um de CUDA mais novo (pedido por outra dependência) e o
          # disco do runner acabava.
          pip install -r requirements-ci.txt -r requirements-dev.txt -c constraints-ci.txt

      # Erros que quebram em execução (sintaxe, nomes indefinidos) e código
      # morto (imports e variáveis sem uso, definições repetidas).
      - name: Lint
        run: ruff check src tests main.py --select E9,F63,F7,F82,F401,F811,F841
      - name: Complexidade (McCabe até 12)
        run: ruff check src --select C901 --config 'lint.mccabe.max-complexity=12'

      # Regras de dependência entre camadas e módulos (arquivo .importlinter).
      - name: Architecture (import contracts)
        run: lint-imports

      - name: Tests (unit, smoke, integration)
        run: pytest tests/unit tests/smoke tests/integration -q

      # API real contra PostgreSQL e Redis: cadastro, login, envio, isolamento
      # entre usuários, exclusão e bloqueio de login. Os modelos de IA não
      # rodam; as tarefas ficam na fila. O armazenamento S3 usa o servidor
      # do moto, que fala a mesma API do S3 e do MinIO.
      - name: End-to-end API tests
        env:
          E2E: "1"
          LIGHTWEIGHT_BOOTSTRAP: "0"
          SECRET_KEY: chave-somente-para-a-integracao-continua-0123456789
          DEFAULT_ADMIN_EMAIL: admin-ci@ifba.edu.br
          DEFAULT_ADMIN_PASSWORD: AdminCi2026
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          STORAGE_S3_BUCKET: midias
          STORAGE_S3_ENDPOINT_URL: http://localhost:5000
          STORAGE_S3_ACCESS_KEY: ci
          STORAGE_S3_SECRET_KEY: ci
        run: |
          moto_server -p 5000 &
          alembic upgrade head
          pytest tests/e2e -q

  # Interface (pasta frontend/): tipos, lint, testes de componentes, build e
  # fumaça de ponta a ponta com a API simulada.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e

  # Os arquivos do Compose (padrão e variantes) e os scripts de implantação
  # são válidos. Antes, um erro neles só aparecia na máquina de quem instalava.
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.rocm.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Shell scripts
        run: for f in docker/*.sh scripts/ops/*.sh; do sh -n "$f"; done

  # Garante que um banco novo é criado só pelas migrações (é o que o
  # entrypoint do contêiner executa) e que o esquema bate com os modelos.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migration dependencies
        run: |
          python -m pip install --upgrade pip
          # numpy: os modelos importam o domínio da análise (verificação de fidelidade).
          pip install alembic "sqlalchemy[asyncio]" psycopg2-binary asyncpg aiosqlite pgvector \
            pydantic pydantic-settings python-dotenv structlog "numpy~=2.4.6"

      - name: Upgrade from an empty database
        run: alembic upgrade head

      - name: Models and schema match
        run: alembic check

      - name: Downgrade and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head
