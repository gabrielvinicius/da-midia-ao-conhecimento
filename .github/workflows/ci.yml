name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Execução manual (aba Actions), por exemplo depois de reativar o workflow.
  workflow_dispatch:

# O token só lê o repositório; nenhum job daqui escreve no GitHub.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# As ações são fixadas pelo commit (o comentário diz a versão): uma tag pode
# ser movida para outro código. Em março de 2026, as tags do trivy-action
# foram reescritas para código malicioso; quem fixava o commit não foi
# afetado. O Dependabot (.github/dependabot.yml) propõe as atualizações.
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Mesmas imagens da produção (docker-compose.yml).
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.8
        ports: ["6379:6379"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr

      # Sem GPU no CI: torch e torchvision (versões do requirements.txt) vêm do
      # índice de CPU, e o restante das dependências é instalado sem eles.
      - name: Python dependencies (CPU)
        run: |
          python -m pip install --upgrade pip
          grep -E '^(torch|torchvision)==' requirements.txt > constraints-ci.txt
          pip install -r constraints-ci.txt --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch|torchvision)==' requirements.txt > requirements-ci.txt
          # As versões fixadas viram restrição: sem ela, o pip trocava o PyTorch
          # de CPU por um de CUDA mais novo (pedido por outra dependência) e o
          # disco do runner acabava.
          pip install -r requirements-ci.txt -r requirements-dev.txt -c constraints-ci.txt

      # Erros que quebram em execução (sintaxe, nomes indefinidos) e código
      # morto (imports e variáveis sem uso, definições repetidas).
      - name: Lint
        run: ruff check src tests main.py --select E9,F63,F7,F82,F401,F811,F841
      - name: Complexidade (McCabe até 12)
        run: ruff check src --select C901 --config 'lint.mccabe.max-complexity=12'

      # Regras de dependência entre camadas e módulos (arquivo .importlinter).
      - name: Architecture (import contracts)
        run: lint-imports

      - name: Tests (unit, smoke, integration)
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
        run: pytest tests/unit tests/smoke tests/integration -q

      # API real contra PostgreSQL e Redis: cadastro, login, envio, isolamento
      # entre usuários, exclusão e bloqueio de login. Os modelos de IA não
      # rodam; as tarefas ficam na fila. O armazenamento S3 usa o servidor
      # do moto, que fala a mesma API do S3 e do Garage.
      - name: End-to-end API tests
        env:
          E2E: "1"
          LIGHTWEIGHT_BOOTSTRAP: "0"
          SECRET_KEY: chave-somente-para-a-integracao-continua-0123456789
          DEFAULT_ADMIN_EMAIL: admin-ci@ifba.edu.br
          DEFAULT_ADMIN_PASSWORD: AdminCi2026
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          STORAGE_S3_BUCKET: midias
          STORAGE_S3_ENDPOINT_URL: http://localhost:5000
          STORAGE_S3_ACCESS_KEY: ci
          STORAGE_S3_SECRET_KEY: ci
        run: |
          moto_server -p 5000 &
          alembic upgrade head
          pytest tests/e2e -q

  # Interface (pasta frontend/): tipos, lint, testes de componentes, build e
  # fumaça de ponta a ponta com a API simulada.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke
        run: npm run test:e2e

  # Infraestrutura como código: arquivos do Compose (padrão e variantes),
  # scripts de operação, Dockerfiles e os próprios workflows. Antes, um erro
  # neles só aparecia na máquina de quem instalava.
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compose files
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.rocm.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          # Os perfis opcionais também precisam montar.
          COMPOSE_PROFILES=internet,s3 docker compose config -q

      # Erros de shell além da sintaxe (variáveis sem aspas, comandos que
      # falham em silêncio), para o sh dos contêineres e do Git Bash.
      - name: Shell scripts (shellcheck)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo koalaman/shellcheck:v0.11.0 -x -s sh docker/*.sh scripts/ops/*.sh

      - name: PowerShell scripts
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem scripts/ops/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; exit 1 }
          }

      # Boas práticas de Dockerfile (camadas, versões, usuário, apt); exceções
      # justificadas em .hadolint.yaml.
      - name: Dockerfiles (hadolint)
        run: |
          for f in Dockerfile frontend/Dockerfile docker/docs.Dockerfile; do
            echo "== $f"
            docker run --rm -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" -i hadolint/hadolint:v2.15.1 < "$f"
          done

      # Sintaxe e expressões dos workflows (actionlint) e falhas de segurança
      # conhecidas neles: ações sem commit fixo, permissões largas, injeção de
      # código por contexto (zizmor).
      - name: Workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Workflows (zizmor)
        run: pipx run zizmor==1.31.0 --offline --min-severity medium .github/workflows

  # Garante que um banco novo é criado só pelas migrações (é o que o serviço
  # migrate do Compose executa) e que o esquema bate com os modelos.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Migration dependencies
        run: |
          python -m pip install --upgrade pip
          # numpy: os modelos importam o domínio da análise (verificação de fidelidade).
          pip install alembic "sqlalchemy[asyncio]" psycopg2-binary asyncpg aiosqlite pgvector \
            pydantic pydantic-settings python-dotenv structlog "numpy~=2.4.6"

      - name: Upgrade from an empty database
        run: alembic upgrade head

      - name: Models and schema match
        run: alembic check

      - name: Downgrade and upgrade again
        run: |
          alembic downgrade base
          alembic upgrade head

  # Documentação (docs/ e README): Markdown conferido, links internos, com as
  # âncoras, verificados e o site (Zensical) gerado. Offline: só os links do próprio repositório; um site
  # externo fora do ar não deve quebrar a CI. A referência gerada a partir do
  # código é conferida pelo teste tests/unit/test_docs_reference.py (backend).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Markdown (markdownlint)
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            README.md
            docs/**/*.md

      - name: Links internos e âncoras (lychee)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress README.md 'docs/**/*.md'
          fail: true
          jobSummary: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # O site (zensical.toml) em modo estrito: um link para página inexistente
      # reprova aqui, antes de reprovar a imagem na implantação.
      - name: Site da documentação (Zensical)
        run: |
          pip install -r requirements-docs.txt
          zensical build --strict
