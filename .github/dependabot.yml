# Atualizações automáticas de dependências (PRs semanais, agrupados por
# ecossistema). Cada PR passa pela CI antes do merge, e nada é implantado sem
# ele. As ações dos workflows são fixadas pelo commit, e é o Dependabot que
# mantém esses commits em dia.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      python: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # Fixados juntos e ligados ao CUDA da imagem (ADR-014); mudam à mão,
      # com a medição de tempos e memória na GPU.
      - dependency-name: torch
      - dependency-name: torchvision
      # Abaixo de 4.50 enquanto o Moondream 2 usar a revisão de 2024-08-26.
      - dependency-name: transformers
        versions: [">=4.50"]
      # O sentence-transformers 6 exige transformers >= 4.50 (o #129 não
      # instalava); sobe junto com a trava acima.
      - dependency-name: sentence-transformers
        versions: [">=6"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      frontend: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # O TypeScript 7 não é aceito pelo typescript-eslint 8: sobe à mão,
      # quando o typescript-eslint o aceitar.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Os tipos do Node seguem o Node da imagem e da CI (24, LTS); sobem
      # junto com ele.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Imagens base dos Dockerfiles e imagens dos serviços do Compose.
  - package-ecosystem: docker
    directories: [/, /frontend]
    schedule: { interval: weekly, day: monday }
    ignore:
      # Só versões LTS (pares) do Node; a troca de LTS é feita à mão, junto
      # com o node-version da CI.
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
